# Rerun sandbox D1 migration/deployment after the owner added the dedicated D1 GitHub secret (2026-11-23 CT).
name: Deploy BruA1 Checkout Sandbox (Manual, Test-Only)

on:
  push:
    branches: [main]
    paths:
      - "workers/brua1-checkout-sandbox/index.mjs"
      - "workers/brua1-checkout-sandbox/sandbox-matrix.mjs"
      - "workers/brua1-checkout-sandbox/sandbox-skus.mjs"
      - "workers/brua1-checkout-sandbox/schema-matrix.sql"
      - "tests/checkout-sandbox-matrix.test.mjs"
      - ".github/workflows/deploy-checkout-sandbox.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brua1-checkout-sandbox-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy secure checkout Worker after approval
    runs-on: ubuntu-latest
    environment: checkout-sandbox
    timeout-minutes: 12
    steps:
      - name: Check out latest reviewed main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify test-only sandbox source and no private-master delivery
        run: |
          node --check workers/brua1-checkout-sandbox/index.mjs
          node --check workers/brua1-checkout-sandbox/sandbox-matrix.mjs
          node --check workers/brua1-checkout-sandbox/sandbox-skus.mjs
          node --test tests/checkout-sandbox.test.mjs tests/checkout-sandbox-matrix.test.mjs
          node --input-type=module -e "import {matrixSanityCheck} from './workers/brua1-checkout-sandbox/sandbox-matrix.mjs';const x=matrixSanityCheck();if(x.tracks!==36||x.variants!==108||x.held!==3||x.realMoney||x.masterAudio)process.exit(1)"
          grep -Fq 'https://api-m.sandbox.paypal.com' workers/brua1-checkout-sandbox/index.mjs
          ! grep -Fq 'https://api-m.paypal.com' workers/brua1-checkout-sandbox/index.mjs
          grep -Fq 'https://api-m.sandbox.paypal.com' workers/brua1-checkout-sandbox/sandbox-matrix.mjs
          ! grep -Fq 'https://api-m.paypal.com' workers/brua1-checkout-sandbox/sandbox-matrix.mjs
          ! grep -Fq 'INSTRUMENTAL_MASTERS' workers/brua1-checkout-sandbox/sandbox-matrix.mjs
          ! grep -Fq 'env.INSTRUMENTAL_MASTERS' workers/brua1-checkout-sandbox/index.mjs
          ! grep -Eq '^\[\[r2_buckets\]\]|^route\s*=' workers/brua1-checkout-sandbox/wrangler.toml

      - name: Check Cloudflare deployment secret availability (no values printed)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub secret CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub secret CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }

      - name: Verify append-only SANDBOX D1 matrix schema locally
        run: |
          python3 - <<'PY'
          import pathlib,sqlite3
          sql=pathlib.Path("workers/brua1-checkout-sandbox/schema-matrix.sql").read_text()
          assert all(word not in sql.upper() for word in ("DROP TABLE", "DELETE FROM", "ATTACH DATABASE", "ALTER TABLE"))
          conn=sqlite3.connect(":memory:")
          conn.executescript(sql)
          tables={x[0] for x in conn.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {"matrix_orders","matrix_receipt_tokens"}.issubset(tables),tables
          print("PASS: two separate append-only SANDBOX receipt/order tables; existing pilot untouched")
          PY

      - name: Require separate least-privilege Cloudflare D1 Edit token
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_D1_API_TOKEN" || { echo "::error::Sandbox D1 migration blocked: add GitHub Actions secret CLOUDFLARE_D1_API_TOKEN with Cloudflare Account > D1 > Edit permission, scoped to your Cloudflare account. Never place the secret in source code."; exit 1; }

      - name: Apply additive SQL migration to existing SANDBOX-ONLY D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute brua1-orders-sandbox --remote --file=workers/brua1-checkout-sandbox/schema-matrix.sql --config workers/brua1-checkout-sandbox/wrangler.toml

      - name: Deploy isolated Workers.dev sandbox only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config workers/brua1-checkout-sandbox/wrangler.toml
