name: Initialize BruA1 Production D1 — No Live Sales
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-production-d1.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brua1-production-d1-bootstrap
  cancel-in-progress: false
jobs:
  verify-and-bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify schema, staging catalog and release locks before remote migration
        run: |
          python3 -m py_compile scripts/bootstrap-production-d1.py
          node --test tests/prepare-disabled-commerce-seed.test.mjs tests/license-v3-publishing-manifest.test.mjs tests/publishing-schedule-schema.test.mjs
          node --input-type=module -e 'import fs from "node:fs"; const s=JSON.parse(fs.readFileSync("fulfillment/launch-approval-status.json")); if(s.payments_live!==false||s.automatic_full_master_delivery_live!==false)process.exit(1)'
      - name: Initialize and verify only the owner-created production database
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/bootstrap-production-d1.py
