name: BruA1 Music Network isolated foundation
on:
  push:
    branches: [main]
    paths:
      - "workers/brua1-music-network/**"
      - "tests/music-network.test.mjs"
      - "scripts/bootstrap-music-network.py"
      - "scripts/install-network-paypal-plans.py"
      - ".github/workflows/deploy-music-network-locked.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brua1-shared-paypal-production
  cancel-in-progress: false
jobs:
  provision-locked:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test authentication and membership access controls
        run: node --test tests/music-network.test.mjs tests/network-subscription-entitlement.test.mjs tests/network-enrollment.test.mjs tests/network-paypal-broker.test.mjs
      - name: Provision isolated community D1 only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python3 scripts/bootstrap-music-network.py
      - name: Deploy locked community Worker with no billing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy --config workers/brua1-music-network/wrangler.bound.toml
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://brua1-music-network.a1productions0527.workers.dev/health | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["databaseReady"] and x["locked"] and not x["billingEnabled"] and not x["memberApiEnabled"] and not x["inviteAuthEnabled"]; print("VERIFIED: community Worker connected to its own database, public registration, member API and billing locked.")'
      - name: Read verified inactive PayPal plan IDs and install isolated mappings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/generate-locked-storage-config.py checkout
          NONCE="$(date -u +%s%3N).$(openssl rand -hex 32)"
          echo "::add-mask::$NONCE"
          CONFIG=workers/brua1-checkout-production/wrangler.bound.toml
          printf '%s' "$NONCE" | npx --yes wrangler@4 secret put PAYPAL_VERIFY_NONCE --config "$CONFIG" >/dev/null
          trap 'printf "y\\n" | npx --yes wrangler@4 secret delete PAYPAL_VERIFY_NONCE --config "$CONFIG" >/dev/null' EXIT
          for attempt in 1 2 3 4 5 6; do
            NETWORK_RESULT="$(curl --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $NONCE" https://brua1-checkout-production.a1productions0527.workers.dev/internal/provision-network-plans)"
            if ! grep -q NOT_AUTHORIZED <<<"$NETWORK_RESULT"; then break; fi
            sleep 3
          done
          export NETWORK_RESULT
          python3 scripts/install-network-paypal-plans.py
      - name: Configure shared broker credential while billing is locked
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$KEY"
          printf '%s' "$KEY" | npx --yes wrangler@4 secret put NETWORK_BROKER_KEY --config workers/brua1-checkout-production/wrangler.bound.toml >/dev/null
          printf '%s' "$KEY" | npx --yes wrangler@4 secret put NETWORK_BROKER_KEY --config workers/brua1-music-network/wrangler.bound.toml >/dev/null
          echo "Broker credentials installed; payment enrollment still locked."
      - name: Verify actual authenticated service bridge with billing disabled
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 https://brua1-music-network.a1productions0527.workers.dev/health | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["databaseReady"] and x["locked"] and x["brokerConnected"] and not x["billingEnabled"];print("VERIFIED: authenticated production community-to-PayPal service bridge; no charge, enrollment closed.")'
