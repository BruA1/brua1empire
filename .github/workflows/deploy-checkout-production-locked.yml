name: BruA1 Live PayPal Credential Holder — Locked Prelaunch QA
on:
  pull_request:
    paths:
      - "workers/brua1-checkout-production/**"
      - "fulfillment/seed-private-assets.mjs"
      - "fulfillment/private-master-key-digests.json"
      - "fulfillment/production-paypal-client.mjs"
      - "fulfillment/production-checkout-service.mjs"
      - "fulfillment/paypal-event-reconciliation.mjs"
      - "tests/production-checkout-ledger.integration.test.mjs"
      - "tests/live-paypal-credential-holder.test.mjs"
      - ".github/workflows/deploy-checkout-production-locked.yml"
  push:
    branches: [main]
    paths:
      - "workers/brua1-checkout-production/**"
      - "fulfillment/seed-private-assets.mjs"
      - "fulfillment/private-master-key-digests.json"
      - "fulfillment/production-paypal-client.mjs"
      - "fulfillment/production-checkout-service.mjs"
      - "fulfillment/paypal-event-reconciliation.mjs"
      - "tests/production-checkout-ledger.integration.test.mjs"
      - "tests/live-paypal-credential-holder.test.mjs"
      - ".github/workflows/deploy-checkout-production-locked.yml"
permissions:
  contents: read
concurrency:
  group: brua1-checkout-production-locked
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify live checkout Worker is hard-locked and contains no secrets
        run: |
          node --check workers/brua1-checkout-production/index.mjs
          node --test tests/live-paypal-credential-holder.test.mjs tests/live-paypal-oauth-probe.test.mjs tests/storage-probe.test.mjs tests/production-checkout-routes.test.mjs tests/production-checkout-service.test.mjs tests/production-checkout-ledger.integration.test.mjs tests/paypal-webhook-provision.test.mjs tests/paypal-merchant-probe.test.mjs
          ! grep -Eq '^\[\[(d1_databases|r2_buckets)\]\]|^route\s*=' workers/brua1-checkout-production/wrangler.toml
          grep -Fq 'CHECKOUT_ROUTES_ENABLED = "false"' workers/brua1-checkout-production/wrangler.toml
          grep -Fq 'LIVE_CHECKOUT_ENABLED = "false"' workers/brua1-checkout-production/wrangler.toml
  deploy-locked-only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resolve exact production D1 and generate locked storage bindings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python3 scripts/generate-locked-storage-config.py checkout
      - name: Publish locked-down Live credential destination only — no charges
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config workers/brua1-checkout-production/wrangler.bound.toml

      - name: Verify real bound storage without exposing audio or enabling sales
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/probe-locked-storage.sh checkout

      - name: One-time verify PayPal LIVE OAuth without charging or revealing tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The two existing Cloudflare PAYPAL_* secrets remain encrypted.
          # This random test-only credential expires after ten minutes.
          PROBE_TOKEN="$(date -u +%s%3N).$(openssl rand -hex 32)"
          echo "::add-mask::$PROBE_TOKEN"
          key_installed=0
          cleanup() {
            local status=$?
            trap - EXIT
            if [ "$key_installed" = 1 ]; then
              if ! (printf 'y\n' | npx --yes wrangler@4 secret delete PAYPAL_VERIFY_NONCE --config workers/brua1-checkout-production/wrangler.bound.toml >/dev/null); then
                echo "::error::Temporary verification key cleanup failed; it expires automatically after 10 minutes."
                status=1
              fi
            fi
            exit "$status"
          }
          trap cleanup EXIT
          printf '%s' "$PROBE_TOKEN" | npx --yes wrangler@4 secret put PAYPAL_VERIFY_NONCE --config workers/brua1-checkout-production/wrangler.bound.toml >/dev/null
          key_installed=1
          # No orders, captures, refunds, file delivery or database writes.
          # A newly deployed Worker secret may take a few seconds to reach the
          # public Workers.dev edge. Retry ONLY authorization-not-ready responses.
          # Never retry a PayPal credential-rejection response.
          PAYPAL_PROBE_RESULT=""
          for attempt in 1 2 3 4 5 6; do
            PAYPAL_PROBE_RESULT="$(curl --silent --show-error --max-time 25 \
              --request POST \
              --header "Authorization: Bearer $PROBE_TOKEN" \
              --header "Accept: application/json" \
              "https://brua1-checkout-production.a1productions0527.workers.dev/internal/verify-live-oauth")"
            CHECK_CODE="$(PAYPAL_PROBE_RESULT="$PAYPAL_PROBE_RESULT" python3 -c 'import os,json; r=json.loads(os.environ.get("PAYPAL_PROBE_RESULT","{}")); print(r.get("code","UNKNOWN"))' 2>/dev/null || echo UNKNOWN)"
            if [ "$CHECK_CODE" != "NOT_AUTHORIZED" ]; then break; fi
            if [ "$attempt" -lt 6 ]; then sleep 4; fi
          done
          export PAYPAL_PROBE_RESULT
          python3 - <<'PY'
          import json,os,sys
          try:
              r=json.loads(os.environ.get("PAYPAL_PROBE_RESULT","{}"))
              accepted=(r.get("verified") is True and r.get("code")=="PAYPAL_LIVE_OAUTH_ACCEPTED"
                        and r.get("paymentsEnabled") is False)
              allowed={"PAYPAL_LIVE_OAUTH_ACCEPTED","LIVE_CREDENTIAL_MISSING","PAYPAL_REJECTED_CREDENTIALS",
                       "PAYPAL_OAUTH_UNAVAILABLE","PAYPAL_OAUTH_INVALID_RESPONSE",
                       "PAYPAL_NETWORK_OR_TLS_ERROR","PAYPAL_CREDENTIAL_ENCODING_ERROR",
                       "WORKER_TIMEOUT_UNSUPPORTED","PAYPAL_RESPONSE_NOT_JSON","PRELAUNCH_GATE_NOT_LOCKED","NOT_AUTHORIZED"}
              code=r.get("code","UNRECOGNIZED_RESPONSE")
              if code not in allowed: code="UNRECOGNIZED_RESPONSE"
              print("BruA1 PayPal LIVE OAuth: "+("PASS" if accepted else "NOT VERIFIED")+" ("+code+")")
              print("Real customer charges: DISABLED")
              sys.exit(0 if accepted else 1)
          except (ValueError,TypeError,KeyError):
              print("BruA1 PayPal LIVE OAuth: NOT VERIFIED (INVALID_RESULT)")
              sys.exit(1)
          PY
          # Resolve the 72 approved-candidate key digests inside private R2.
          ASSET_RESULT="$(curl --silent --show-error --max-time 60 -X POST -H "Authorization: Bearer $PROBE_TOKEN" "https://brua1-checkout-production.a1productions0527.workers.dev/internal/seed-private-assets")"
          ASSET_RESULT="$ASSET_RESULT" python3 -c 'import os,json; x=json.loads(os.environ["ASSET_RESULT"]); assert x.get("verified") is True and x.get("assets")==72 and x.get("tracks")==36 and x.get("paymentsEnabled") is False and x.get("deliveryEnabled") is False; print("VERIFIED: 36 MP3 + 36 WAV private asset mappings installed in production D1; no sales or downloads activated.")'
          # Register only this app's payment notification subscription, then read it back.
          WEBHOOK_RESULT="$(curl --silent --show-error --max-time 30 -X POST -H "Authorization: Bearer $PROBE_TOKEN" "https://brua1-checkout-production.a1productions0527.workers.dev/internal/provision-paypal-webhook")"
          WEBHOOK_ID="$(WEBHOOK_RESULT="$WEBHOOK_RESULT" python3 -c 'import json,os,re; x=json.loads(os.environ["WEBHOOK_RESULT"]); assert x.get("verified") is True and x.get("registeredEvents")==4 and x.get("paymentsEnabled") is False; i=x["webhookId"]; assert re.fullmatch("[A-Z0-9]{8,50}",i); print(i)')"
          echo "::add-mask::$WEBHOOK_ID"
          printf '%s' "$WEBHOOK_ID" | npx --yes wrangler@4 secret put PAYPAL_WEBHOOK_ID --config workers/brua1-checkout-production/wrangler.bound.toml >/dev/null
          echo "VERIFIED: PayPal LIVE webhook subscription registered and read back; four event types, no charges."
          # Create an unapproved verification order and verify PayPal's default payee.
          MERCHANT_RESULT="$(curl --silent --show-error --max-time 40 -X POST -H "Authorization: Bearer $PROBE_TOKEN" "https://brua1-checkout-production.a1productions0527.workers.dev/internal/verify-live-merchant")"
          MERCHANT_ID="$(MERCHANT_RESULT="$MERCHANT_RESULT" python3 -c 'import json,os,re; x=json.loads(os.environ["MERCHANT_RESULT"]); assert x.get("verified") is True and x.get("orderCreated") is True and x.get("paymentCaptured") is False and x.get("paymentsEnabled") is False; i=x["merchantId"]; assert re.fullmatch("[2-9A-HJ-NP-Z]{13}",i); print(i)')"
          echo "::add-mask::$MERCHANT_ID"
          printf '%s' "$MERCHANT_ID" | npx --yes wrangler@4 secret put PAYPAL_MERCHANT_ID --config workers/brua1-checkout-production/wrangler.bound.toml >/dev/null
          echo "VERIFIED: PayPal default Live merchant matches owner screenshot; ID configured as encrypted Worker secret. No payment captured."
