name: Diagnose founding signup — read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-founding-signup.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public site and live membership API without credentials or writes
        run: |
          python3 - <<'PY'
          import subprocess,json
          base="https://brua1-music-network.a1productions0527.workers.dev"
          for origin in ["https://brua1.com","https://www.brua1.com"]:
            for path in ["/health","/api/network/beta/config"]:
              p=subprocess.run(["curl","-sS","--max-time","15","-D","-","-H","Origin: "+origin,base+path],capture_output=True,text=True)
              print("PROBE",origin,path,"curl exit",p.returncode)
              raw=p.stdout.replace("\r\n","\n"); headers,_,body=raw.partition("\n\n")
              for line in headers.splitlines():
                if line.lower().startswith(("http/","access-control-allow-origin:","content-type:","location:")): print(line)
              try:
                x=json.loads(body)
                print(json.dumps({k:v for k,v in x.items() if k in ["service","databaseReady","brokerConnected","memberApiEnabled","inviteAuthEnabled","billingEnabled","publicBetaEnabled","locked","error","registered","active","listed","limit","spotsRemaining"]}))
              except Exception: print("Non-JSON response")
          for page in ["https://brua1.com/music-network.html","https://brua1.com/music-network.js"]:
            p=subprocess.run(["curl","-sSL","--max-time","15","-w","\n%{http_code} %{url_effective}","-D","/tmp/probeheaders",page],capture_output=True,text=True)
            body,_,result=p.stdout.rpartition("\n")
            print("ASSET",page,result,"bytes",len(body),"founding UI", "beta-registration" in body, "health probe", "/health" in body)
            for line in open("/tmp/probeheaders"):
              if line.lower().startswith(("content-security-policy:","content-type:")): print(line.strip())
          PY

      - name: Count founding registrations by Central calendar day (read only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          from datetime import datetime, timedelta, time
          from zoneinfo import ZoneInfo
          tz=ZoneInfo("America/Chicago")
          today=datetime.now(tz).date()
          start=int(datetime.combine(today-timedelta(days=1),time.min,tz).timestamp())
          middle=int(datetime.combine(today,time.min,tz).timestamp())
          end=int(datetime.combine(today+timedelta(days=1),time.min,tz).timestamp())
          account=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_D1_API_TOKEN"]
          base="https://api.cloudflare.com/client/v4/accounts/"+account
          def call(path, body=None):
              req=urllib.request.Request(base+path,data=None if body is None else json.dumps(body).encode(),headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=15) as response:
                      result=json.load(response)
              except urllib.error.HTTPError as e:
                  raise RuntimeError("Cloudflare count query failed HTTP "+str(e.code)) from None
              if not result.get("success"): raise RuntimeError("Cloudflare count query failed")
              return result["result"]
          matches=[d for d in call("/d1/database?name=brua1-music-network") if d["name"]=="brua1-music-network"]
          if len(matches)!=1: raise RuntimeError("Expected one production membership database")
          sql="""SELECT COUNT(*) AS total,
          COALESCE(SUM(CASE WHEN m.created_at >= ? AND m.created_at < ? THEN 1 ELSE 0 END),0) AS yesterday,
          COALESCE(SUM(CASE WHEN m.created_at >= ? AND m.created_at < ? THEN 1 ELSE 0 END),0) AS today,
          COALESCE(SUM(CASE WHEN m.created_at < ? THEN 1 ELSE 0 END),0) AS earlier
          FROM network_founding_members f JOIN network_members m ON m.id=f.member_id"""
          data=call("/d1/database/"+matches[0]["uuid"]+"/query",{"sql":sql,"params":[start,middle,middle,end,start]})
          counts=data[0]["results"][0]
          print("FOUNDING_DAILY_COUNTS",json.dumps({"yesterday_date":str(today-timedelta(days=1)),"today_date":str(today),"checked_at":datetime.now(tz).isoformat(),**counts}))
          PY

# Follow-up probe after member-reported sign-in issue; no credentials or account mutations.
