name: Network directory review — test only
on:
  pull_request:
    paths:
      - 'music-network.*'
      - 'workers/brua1-music-network/**'
      - 'tests/music-network.test.mjs'
      - '.github/workflows/network-directory-review.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/music-network.test.mjs tests/network-subscription-entitlement.test.mjs tests/network-enrollment.test.mjs tests/network-paypal-broker.test.mjs
