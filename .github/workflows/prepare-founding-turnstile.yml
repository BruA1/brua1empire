name: BruA1 founding beta — prepare human verification, no launch
on:
  push:
    branches: [main]
    paths:
      - 'scripts/prepare-founding-turnstile.py'
      - '.github/workflows/prepare-founding-turnstile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brua1-shared-paypal-production
  cancel-in-progress: false
jobs:
  prepare-locked:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Provision dedicated widget and encrypted bindings only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/prepare-founding-turnstile.py
