name: BruA1 Public Storefront Deployment — License Options
on:
  pull_request:
    paths:
      - ".assetsignore"
      - "wrangler.jsonc"
      - "sitemap.xml"
      - "founding-members.html"
      - "founding-members.css"
      - "founding-members.js"
      - "fl-studio-resources.html"
      - "fl-studio-shortcuts.html"
      - "fl-studio-beginners-guide.html"
      - "fl-studio-mixing-guide.html"
      - "resources.css"
      - "resources.js"
      - "robots.txt"
      - "scripts/validate-search-foundation.mjs"
      - "catalog/instrumentals.json"
      - "catalog/public-license-options.json"
      - "instrumentals.html"
      - "index.html"
      - "learning-center.html"
      - "hub.css"
      - "brua1-artwork.css"
      - "membership-terms.html"
      - "hub.js"
      - "music-network.html"
      - "music-network.css"
      - "music-network.js"
      - "tests/music-network.test.mjs"
      - "scripts/validate-store-license-options.mjs"
      - ".github/workflows/deploy-public-storefront.yml"
  push:
    branches: [main]
    paths:
      - ".assetsignore"
      - "wrangler.jsonc"
      - "sitemap.xml"
      - "founding-members.html"
      - "founding-members.css"
      - "founding-members.js"
      - "fl-studio-resources.html"
      - "fl-studio-shortcuts.html"
      - "fl-studio-beginners-guide.html"
      - "fl-studio-mixing-guide.html"
      - "resources.css"
      - "resources.js"
      - "robots.txt"
      - "scripts/validate-search-foundation.mjs"
      - "catalog/instrumentals.json"
      - "catalog/public-license-options.json"
      - "instrumentals.html"
      - "index.html"
      - "learning-center.html"
      - "hub.css"
      - "brua1-artwork.css"
      - "membership-terms.html"
      - "hub.js"
      - "music-network.html"
      - "music-network.css"
      - "music-network.js"
      - "tests/music-network.test.mjs"
      - ".github/workflows/deploy-public-storefront.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brua1-public-storefront
  cancel-in-progress: false

jobs:
  independent-qa:
    name: Verify public licensing and safe asset allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify site, license options, public preview URLs
        run: |
          node scripts/validate-store-catalog.mjs
          node scripts/validate-store-license-options.mjs
          node scripts/check-public-previews.mjs
          node --test tests/music-network.test.mjs
          node scripts/validate-search-foundation.mjs
          node --check resources.js
          node --check founding-members.js
      - name: Verify Cloudflare static assets are allowlisted, no private master keys
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          assert.equal(config.name,'brua1empire');
          assert.equal(config.assets?.directory,'./');
          const lines = fs.readFileSync('.assetsignore','utf8').trim().split(/\r?\n/).filter(Boolean);
          assert(lines.includes('*'),'Public assets must have deny-all default');
          for(const item of ['!index.html','!instrumentals.html','!style.css','!script.js','!catalog/','!catalog/instrumentals.json','!catalog/public-license-options.json']){
            assert(lines.includes(item),'Missing public allowlist entry '+item);
          }
          assert(!lines.some(x=>/^!(contracts|fulfillment|workers|tests|docs)\//.test(x)),'Private commerce folders must never be publicly exposed');
          console.log('PASS: only approved public site content is allowed into Cloudflare assets');
          EOF

  deploy:
    name: Publish safe static storefront to existing BruA1 Worker
    if: github.event_name != 'pull_request'
    needs: independent-qa
    runs-on: ubuntu-latest
    environment: website-production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check deployment credentials without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing Cloudflare API token"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing Cloudflare account ID"; exit 1; }
      - name: Deploy safe public assets; no checkout, no private masters
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify deployed search foundation
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors https://brua1.com/sitemap.xml -o /tmp/brua1-sitemap.xml
          curl --fail --silent --show-error --retry 4 --retry-all-errors https://brua1.com/robots.txt -o /tmp/brua1-robots.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/brua1-sitemap.xml').getroot()
          urls=[e.text for e in root.findall('.//{http://www.sitemaps.org/schemas/sitemap/0.9}loc')]
          assert urls==['https://brua1.com/','https://brua1.com/instrumentals','https://brua1.com/learning-center','https://brua1.com/music-network','https://brua1.com/fl-studio-resources','https://brua1.com/fl-studio-shortcuts','https://brua1.com/fl-studio-beginners-guide','https://brua1.com/fl-studio-mixing-guide','https://brua1.com/founding-members']
          assert 'Sitemap: https://brua1.com/sitemap.xml' in open('/tmp/brua1-robots.txt').read()
          print('Verified live sitemap and robots.txt')
          PY
          for path in / /instrumentals /learning-center /music-network /fl-studio-resources /fl-studio-shortcuts /fl-studio-beginners-guide /fl-studio-mixing-guide /founding-members; do
            status="$(curl --silent --show-error --retry 3 -o /tmp/brua1-indexable-page -w '%{http_code}' "https://brua1.com$path")"
            test "$status" = 200
            grep -Fq "rel=\"canonical\" href=\"https://brua1.com$path\"" /tmp/brua1-indexable-page
          done
