name: BruA1 owner-authorized free founding beta release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/launch-founding-beta.yml'
      - 'scripts/prepare-founding-beta-release.py'
permissions:
  contents: read
concurrency:
  group: brua1-shared-paypal-production
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retest membership and billing locks
        run: node --test tests/music-network.test.mjs tests/network-subscription-entitlement.test.mjs tests/network-enrollment.test.mjs tests/network-paypal-broker.test.mjs
      - name: Verify owner-configured keys and existing D1; generate release configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python3 scripts/prepare-founding-beta-release.py
      - name: Deploy free beta only, preserve encrypted secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4 deploy --config workers/brua1-music-network/wrangler.beta-release.toml
      - name: Verify live free registration, site origin and closed billing
        run: |
          set -euo pipefail
          BASE=https://brua1-music-network.a1productions0527.workers.dev
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --max-time 15 -H 'Origin: https://brua1.com' "$BASE/health" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["databaseReady"] and x["memberApiEnabled"] and x["publicBetaEnabled"] and not x["billingEnabled"] and not x["inviteAuthEnabled"] and not x["locked"];print("VERIFIED: free registration enabled, billing disabled")'; then break; fi
            if [ "$attempt" = 8 ]; then exit 1; fi
            sleep 4
          done
          curl --fail --silent --show-error --max-time 15 -H 'Origin: https://brua1.com' "$BASE/api/network/beta/config" | python3 -c 'import json,sys;x=json.load(sys.stdin);assert x["limit"]==50 and 0<=x["registered"]<=50 and x["reviewAt"]==25 and x["siteKey"];print("VERIFIED: registration config, founder count",x["registered"],"spots remaining",x["spotsRemaining"])'
          status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' -H 'Origin: https://brua1.com' "$BASE/api/network/billing/config")"
          test "$status" = 503
          echo 'VERIFIED: payment enrollment remains closed. No real account created. Owner browser challenge test still required.'
